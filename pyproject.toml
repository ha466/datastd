[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datastd"
version = "0.1.0"
description = "Synthetic voice dataset generator using audio.cpp"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pycloudflared>=0.2",
    "huggingface_hub>=0.23",
]

[project.scripts]
datastd = "datastd.server:main"
